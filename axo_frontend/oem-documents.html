<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents | AXO Networks</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/oem-dashboard.css" />
  <link rel="stylesheet" href="./css/shared.css" />
</head>
<body>

<div class="oem-container">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>AXO Networks</h2>
      <p>OEM Portal</p>
    </div>
    <nav class="sidebar-nav" aria-label="OEM navigation">
      <a href="/oem-dashboard.html"  class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
      <a href="/oem-rfq.html"        class="nav-item"><i class="fas fa-file-alt"></i><span>RFQ Management</span></a>
      <a href="/oem-orders.html"     class="nav-item"><i class="fas fa-shopping-cart"></i><span>Orders</span></a>
      <a href="/oem-suppliers.html"  class="nav-item"><i class="fas fa-truck"></i><span>Suppliers</span></a>
      <a href="/oem-documents.html"  class="nav-item active"><i class="fas fa-folder-open"></i><span>Documents</span></a>
      <a href="/oem-profile.html"    class="nav-item"><i class="fas fa-building"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn" type="button">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i class="fas fa-bars"></i>
      </button>
      <div class="top-bar-right">
        <div class="notification-bell" id="notificationBell">
          <i class="far fa-bell"></i>
          <span class="notification-badge">0</span>
        </div>
        <div class="user-info">
          <span id="companyName">Loading...</span>
          <div class="avatar"><i class="fas fa-industry"></i></div>
        </div>
      </div>
    </div>

    <div class="page-header">
      <div>
        <h1>Document Library</h1>
        <p>Manage your RFQ documents and files</p>
      </div>
      <div class="page-header__actions">
        <button class="btn btn--outline" id="refreshBtn" type="button">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
        <button class="btn btn--primary" id="uploadDocBtn" type="button">
          <i class="fas fa-upload"></i> Upload Document
        </button>
      </div>
    </div>

    <div class="doc-toolbar">
      <span id="docCount" class="result-count"></span>
    </div>

    <div id="documentsGrid" class="documents-grid"></div>
  </main>
</div>

<script>
const token = localStorage.getItem('axo_access_token');
if (!token) { window.location.href = '/login.html'; }

try {
  const user = JSON.parse(localStorage.getItem('axo_user') || '{}');
  document.getElementById('companyName').textContent = user.company_name || user.email || 'OEM User';
} catch(e) {}

document.getElementById('logoutBtn')?.addEventListener('click', function() {
  localStorage.removeItem('axo_access_token');
  localStorage.removeItem('axo_user');
  window.location.href = '/login.html';
});

document.getElementById('menuToggle')?.addEventListener('click', function() {
  document.getElementById('sidebar')?.classList.toggle('open');
});

function openFolder(rfqName) {
  window.location.href = '/view-folder.html?rfq=' + encodeURIComponent(rfqName);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

async function loadDocuments() {
  const grid = document.getElementById('documentsGrid');
  if (grid) grid.innerHTML = '<div class="loading">Loading documents...</div>';
  
  try {
    const response = await fetch('/api/oem/documents', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    if (response.status === 401) {
      localStorage.removeItem('axo_access_token');
      localStorage.removeItem('axo_user');
      window.location.href = '/login.html';
      return;
    }
    
    const data = await response.json();
    const documents = data.documents || [];
    
    const countSpan = document.getElementById('docCount');
    if (countSpan) {
      countSpan.textContent = documents.length + ' document' + (documents.length !== 1 ? 's' : '');
    }
    
    if (documents.length === 0) {
      grid.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>No documents found</p><button class="btn btn--primary" id="uploadFromEmptyBtn">Upload your first document</button></div>';
      const uploadBtn = document.getElementById('uploadFromEmptyBtn');
      if (uploadBtn) uploadBtn.addEventListener('click', function() { alert('Upload feature coming soon'); });
      return;
    }
    
    // Group by RFQ number
    const rfqMap = new Map();
    documents.forEach(function(doc) {
      if (doc.rfq_number) {
        if (!rfqMap.has(doc.rfq_number)) rfqMap.set(doc.rfq_number, []);
        rfqMap.get(doc.rfq_number).push(doc);
      }
    });
    
    let html = '<div class="folder-grid">';
    for (const [rfqName, docs] of rfqMap) {
      const safeName = rfqName.replace(/'/g, "\\'");
      html += '<div class="folder-card" onclick="openFolder(\'' + safeName + '\')">';
      html += '<div class="folder-icon"><i class="fas fa-folder-open"></i></div>';
      html += '<div class="folder-info">';
      html += '<div class="folder-name">📋 ' + escapeHtml(rfqName) + '</div>';
      html += '<div class="folder-stats">' + docs.length + ' document(s)</div>';
      html += '</div>';
      html += '<div class="folder-arrow"><i class="fas fa-chevron-right"></i></div>';
      html += '</div>';
    }
    html += '</div>';
    grid.innerHTML = html;
    
  } catch (error) {
    console.error('Error loading documents:', error);
    grid.innerHTML = '<div class="empty-state">Error loading documents</div>';
  }
}

loadDocuments();
</script>

<div class="notification-overlay" id="notificationOverlay"></div>
<div class="notification-panel" id="notificationPanel">
  <div class="notification-header">
    <h3><i class="fas fa-bell"></i> Notifications</h3>
    <button id="markAllRead">Mark all as read</button>
  </div>
  <div class="notification-list" id="notificationList">
    <div class="notification-empty"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>
  </div>
</div>
<script src="/js/notification.js"></script>
</body>
</html>
