<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Documents | AXO Networks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/oem-dashboard.css">
    <link rel="stylesheet" href="./css/shared.css">
</head>
<body>
<div class="oem-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>AXO Networks</h2>
            <p>OEM Portal</p>
        </div>
        <nav class="sidebar-nav">
            <a href="/oem-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
            <a href="/oem-rfq.html" class="nav-item"><i class="fas fa-file-alt"></i><span>RFQ Management</span></a>
            <a href="/oem-orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Orders</span></a>
            <a href="/oem-suppliers.html" class="nav-item"><i class="fas fa-truck"></i><span>Suppliers</span></a>
            <a href="/oem-documents.html" class="nav-item active"><i class="fas fa-folder-open"></i><span>Documents</span></a>
            <a href="/oem-profile.html" class="nav-item"><i class="fas fa-building"></i><span>Profile</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="top-bar-right">
                <div class="user-info">
                    <span id="companyName">Loading...</span>
                    <div class="avatar"><i class="fas fa-industry"></i></div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button class="btn btn--ghost btn--sm" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back to Documents
            </button>
        </div>

        <div class="page-header" style="margin-bottom: 24px;">
            <div>
                <h1 id="folderTitle">Loading...</h1>
                <p>Documents in this RFQ folder</p>
            </div>
        </div>

        <div id="documentsList" class="documents-grid"></div>
    </main>
</div>

<script>
const token = localStorage.getItem('axo_access_token');
if (!token) { window.location.href = '/login.html'; }

try {
    const user = JSON.parse(localStorage.getItem('axo_user') || '{}');
    document.getElementById('companyName').textContent = user.company_name || user.email || 'OEM User';
} catch(e) {}

document.getElementById('logoutBtn')?.addEventListener('click', function() {
    localStorage.removeItem('axo_access_token');
    localStorage.removeItem('axo_user');
    window.location.href = '/login.html';
});

document.getElementById('menuToggle')?.addEventListener('click', function() {
    document.getElementById('sidebar')?.classList.toggle('open');
});

function goBack() { window.location.href = '/oem-documents.html'; }

const urlParams = new URLSearchParams(window.location.search);
const rfqName = decodeURIComponent(urlParams.get('rfq') || '');
document.getElementById('folderTitle').innerHTML = '<i class="fas fa-folder-open"></i> ' + rfqName;

function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function getFileIcon(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    const icons = {
        pdf: 'fa-file-pdf', dwg: 'fa-file', step: 'fa-cube',
        jpg: 'fa-file-image', png: 'fa-file-image', doc: 'fa-file-word', docx: 'fa-file-word'
    };
    return icons[ext] || 'fa-file';
}

async function downloadDocument(docId, fileName) {
    try {
        // Fetch the document with authorization header
        const response = await fetch('/api/oem/documents/' + docId + '/download', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (response.status === 401) {
            alert('Session expired. Please login again.');
            localStorage.removeItem('axo_access_token');
            localStorage.removeItem('axo_user');
            window.location.href = '/login.html';
            return;
        }
        
        if (!response.ok) {
            throw new Error('Download failed');
        }
        
        // Get the blob from response
        const blob = await response.blob();
        
        // Create download link
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
    } catch (error) {
        console.error('Download error:', error);
        alert('Error downloading file: ' + error.message);
    }
}

async function loadDocuments() {
    const container = document.getElementById('documentsList');
    container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading documents...</div>';
    
    try {
        const response = await fetch('/api/oem/documents', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (response.status === 401) {
            localStorage.removeItem('axo_access_token');
            localStorage.removeItem('axo_user');
            window.location.href = '/login.html';
            return;
        }
        
        const data = await response.json();
        const allDocs = data.documents || [];
        const filteredDocs = allDocs.filter(function(doc) { return doc.rfq_number === rfqName; });
        
        if (filteredDocs.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>No documents found in this folder</p></div>';
            return;
        }
        
        let html = '';
        for (var i = 0; i < filteredDocs.length; i++) {
            var doc = filteredDocs[i];
            var safeFileName = escapeHtml(doc.file_name).replace(/'/g, "\\'");
            html += '<div class="doc-card">';
            html += '<div class="doc-card__icon"><i class="fas ' + getFileIcon(doc.file_name) + ' fa-2x"></i></div>';
            html += '<div class="doc-card__body">';
            html += '<div class="doc-card__name">' + escapeHtml(doc.file_name) + '</div>';
            html += '<div class="doc-card__meta">';
            html += '<span class="doc-card__category">' + escapeHtml(doc.category || 'General') + '</span>';
            html += '<span class="doc-card__size">' + formatFileSize(doc.file_size) + '</span>';
            html += '<span class="doc-card__date">' + new Date(doc.created_at).toLocaleDateString() + '</span>';
            html += '</div>';
            html += '</div>';
            html += '<div class="doc-card__actions">';
            html += '<button class="btn btn--sm btn--primary" onclick="downloadDocument(' + doc.id + ', \'' + safeFileName + '\')">';
            html += '<i class="fas fa-download"></i> Download';
            html += '</button>';
            html += '</div>';
            html += '</div>';
        }
        container.innerHTML = html;
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="empty-state">Error loading documents</div>';
    }
}

loadDocuments();
</script>
</body>
</html>
