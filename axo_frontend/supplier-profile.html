<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Profile | AXO Networks</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/supplier-dashboard.css" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/supplier.css" />
</head>
<body>

<div class="supplier-container">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>AXO Networks</h2>
      <p>Supplier Portal</p>
    </div>
    <nav class="sidebar-nav" aria-label="Supplier navigation">
      <a href="/supplier-dashboard.html" class="nav-item"><i class="fas fa-chart-line"    aria-hidden="true"></i><span>Dashboard</span></a>
      <a href="/supplier-rfq.html"       class="nav-item"><i class="fas fa-file-alt"      aria-hidden="true"></i><span>RFQ Inbox</span></a>
      <a href="/supplier-quotes.html"    class="nav-item"><i class="fas fa-comment-dollar" aria-hidden="true"></i><span>My Quotes</span></a>
      <a href="/supplier-orders.html"    class="nav-item"><i class="fas fa-shopping-cart"  aria-hidden="true"></i><span>My Orders</span></a>
      <a href="/supplier-profile.html"   class="nav-item active"><i class="fas fa-building" aria-hidden="true"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn" type="button">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout
      </button>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="main-content">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle sidebar">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <div class="top-bar-right">
        <div class="notification-bell" aria-label="Notifications">
          <i class="far fa-bell" aria-hidden="true"></i>
          <span class="notification-badge">0</span>
        </div>
        <div class="user-info">
          <!-- JS: setText("companyName", user.company_name) -->
          <span id="companyName">Loading…</span>
          <div class="avatar" aria-hidden="true"><i class="fas fa-truck"></i></div>
        </div>
      </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1>Company Profile</h1>
        <p>Manage your company information and security settings</p>
      </div>
    </div>

    <!-- ════════════════════════════════════════
         PROFILE WRAPPER
         JS: profileWrapper[data-mode] drives view/edit visibility via CSS.
             data-mode="view"  → shows .profile-view-section, hides .profile-edit-section
             data-mode="edit"  → hides  .profile-view-section, shows .profile-edit-section
         ════════════════════════════════════════ -->
    <div id="profileWrapper" class="profile-wrapper" data-mode="view">

      <!-- ── AVATAR + COMPANY HERO ── -->
      <div class="profile-hero">
        <div class="profile-avatar" aria-hidden="true">
          <!--
            JS: setText("avatarInitials", getInitials(profile.company_name))
          -->
          <span id="avatarInitials">—</span>
        </div>
        <div class="profile-hero__info">
          <!--
            JS: setText("profileCompanyName", profile.company_name)
          -->
          <h2 class="profile-hero__name" id="profileCompanyName">Loading…</h2>
          <!--
            JS: setText("profileRole", "Supplier Partner")
          -->
          <p class="profile-hero__role" id="profileRole">Supplier Partner</p>
        </div>
        <!-- Edit button — shown only in view mode -->
        <button
          class="btn btn--outline profile-hero__edit profile-view-only"
          id="editProfileBtn"
          type="button"
        >
          <i class="fas fa-edit" aria-hidden="true"></i> Edit Profile
        </button>
      </div>

      <!-- ════════════════ VIEW MODE ════════════════ -->
      <div class="profile-card profile-view-only">
        <div class="profile-card__header">
          <h3 class="profile-card__title">
            <i class="fas fa-info-circle" aria-hidden="true"></i> Company Information
          </h3>
        </div>
        <div class="profile-card__body">
          <dl class="profile-dl">

            <div class="profile-dl__row">
              <dt><i class="fas fa-envelope" aria-hidden="true"></i> Email</dt>
              <!-- JS: setText("viewEmail", profile.email) -->
              <dd id="viewEmail">—</dd>
            </div>

            <div class="profile-dl__row">
              <dt><i class="fas fa-phone" aria-hidden="true"></i> Phone</dt>
              <!-- JS: setText("viewPhone", profile.phone || "Not provided") -->
              <dd id="viewPhone">—</dd>
            </div>

            <div class="profile-dl__row">
              <dt><i class="fas fa-globe" aria-hidden="true"></i> Website</dt>
              <!-- JS: setText("viewWebsite", profile.website || "Not provided") -->
              <dd id="viewWebsite">—</dd>
            </div>

            <div class="profile-dl__row">
              <dt><i class="fas fa-map-marker-alt" aria-hidden="true"></i> City</dt>
              <!-- JS: setText("viewCity", profile.city || "Not provided") -->
              <dd id="viewCity">—</dd>
            </div>

            <div class="profile-dl__row">
              <dt><i class="fas fa-flag" aria-hidden="true"></i> Country</dt>
              <!-- JS: setText("viewCountry", profile.country || "Not provided") -->
              <dd id="viewCountry">—</dd>
            </div>

          </dl>
        </div>
      </div>

      <!-- ════════════════ EDIT MODE ════════════════ -->
      <div class="profile-card profile-edit-only">
        <div class="profile-card__header">
          <h3 class="profile-card__title">
            <i class="fas fa-edit" aria-hidden="true"></i> Edit Profile
          </h3>
        </div>
        <div class="profile-card__body">

          <!--
            JS: profileForm submit → saveProfile(e) → API.put("/supplier/profile", payload)
            id="profileForm" — REQUIRED
          -->
          <form id="profileForm" novalidate>

            <!-- Read-only: email & company name cannot be changed -->
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-envelope" aria-hidden="true"></i> Email
                  <span class="form-hint">(cannot be changed)</span>
                </label>
                <!--
                  JS: setText("editEmailDisplay", profile.email)
                -->
                <div class="form-static" id="editEmailDisplay">—</div>
              </div>

              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-building" aria-hidden="true"></i> Company Name
                  <span class="form-hint">(cannot be changed)</span>
                </label>
                <!--
                  JS: setText("editCompanyDisplay", profile.company_name)
                -->
                <div class="form-static" id="editCompanyDisplay">—</div>
              </div>
            </div>

            <!-- Editable fields -->
            <div class="form-row">
              <div class="form-group">
                <label for="editPhone" class="form-label">
                  <i class="fas fa-phone" aria-hidden="true"></i> Phone
                </label>
                <!--
                  JS: setVal("editPhone", profile.phone) in populateEditForm()
                      el("editPhone").value.trim() → sent as phone in PUT payload
                -->
                <input
                  type="tel"
                  id="editPhone"
                  class="form-control"
                  placeholder="+1 555 123 4567"
                  autocomplete="tel"
                />
              </div>

              <div class="form-group">
                <label for="editWebsite" class="form-label">
                  <i class="fas fa-globe" aria-hidden="true"></i> Website
                </label>
                <!--
                  JS: setVal("editWebsite", profile.website)
                      el("editWebsite").value.trim() → sent as website
                -->
                <input
                  type="url"
                  id="editWebsite"
                  class="form-control"
                  placeholder="https://yourcompany.com"
                  autocomplete="url"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="editCity" class="form-label">
                  <i class="fas fa-map-marker-alt" aria-hidden="true"></i> City
                </label>
                <!--
                  JS: setVal("editCity", profile.city)
                -->
                <input
                  type="text"
                  id="editCity"
                  class="form-control"
                  placeholder="Mumbai"
                  autocomplete="address-level2"
                />
              </div>

              <div class="form-group">
                <label for="editCountry" class="form-label">
                  <i class="fas fa-flag" aria-hidden="true"></i> Country
                </label>
                <!--
                  JS: setVal("editCountry", profile.country)
                -->
                <input
                  type="text"
                  id="editCountry"
                  class="form-control"
                  placeholder="India"
                  autocomplete="country-name"
                />
              </div>
            </div>

            <div class="form-actions">
              <!--
                JS: cancelEditBtn click → _setMode("view")
              -->
              <button type="button" class="btn btn--outline" id="cancelEditBtn">Cancel</button>
              <!--
                JS: saveProfileBtn.disabled = true during API call
                    id="saveProfileBtn" — REQUIRED
              -->
              <button type="submit" class="btn btn--primary" id="saveProfileBtn">
                <i class="fas fa-save" aria-hidden="true"></i> Save Changes
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- ════════════════ CHANGE PASSWORD ════════════════ -->
      <!--
        Shown in both view and edit mode — always available
      -->
      <div class="profile-card">
        <div class="profile-card__header">
          <h3 class="profile-card__title">
            <i class="fas fa-lock" aria-hidden="true"></i> Change Password
          </h3>
        </div>
        <div class="profile-card__body">

          <!--
            JS: passwordForm submit → handleChangePassword(e) → API.post("/auth/change-password", ...)
            id="passwordForm" — REQUIRED
          -->
          <form id="passwordForm" novalidate>

            <div class="form-group">
              <label for="currentPassword" class="form-label">Current Password</label>
              <!--
                JS: el("currentPassword").value used in handleChangePassword()
              -->
              <input
                type="password"
                id="currentPassword"
                class="form-control"
                placeholder="Enter your current password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="newPassword" class="form-label">New Password</label>
                <!--
                  JS: el("newPassword").value — validated: length ≥ 8
                -->
                <input
                  type="password"
                  id="newPassword"
                  class="form-control"
                  placeholder="At least 8 characters"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </div>

              <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <!--
                  JS: el("confirmPassword").value — must match newPassword
                -->
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-control"
                  placeholder="Repeat new password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </div>
            </div>

            <div class="form-actions">
              <!--
                JS: savePasswordBtn.disabled = true; savePasswordBtn.textContent = "Updating…"
                    id="savePasswordBtn" — REQUIRED
              -->
              <button type="submit" class="btn btn--primary" id="savePasswordBtn">
                <i class="fas fa-key" aria-hidden="true"></i> Update Password
              </button>
            </div>

          </form>
        </div>
      </div>

    </div><!-- /#profileWrapper -->

  </main>
</div>

<script type="module" src="/js/pages/supplier/profile.js"></script>

</body>
</html>
