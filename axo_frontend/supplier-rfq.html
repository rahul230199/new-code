<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFQ Inbox | AXO Networks</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- ✅ FIXED PATHS -->
  <link rel="stylesheet" href="/css/supplier-dashboard.css" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/supplier.css" />
</head>
<body>

<div class="supplier-container">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>AXO Networks</h2>
      <p>Supplier Portal</p>
    </div>

    <nav class="sidebar-nav">
      <a href="/supplier-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
      <a href="/supplier-rfq.html" class="nav-item active"><i class="fas fa-file-alt"></i><span>RFQ Inbox</span></a>
      <a href="/supplier-quotes.html" class="nav-item"><i class="fas fa-comment-dollar"></i><span>My Quotes</span></a>
      <a href="/supplier-orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>My Orders</span></a>
      <a href="/supplier-profile.html" class="nav-item"><i class="fas fa-building"></i><span>Profile</span></a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </button>

      <div class="top-bar-right">
        <div class="notification-bell">
          <i class="far fa-bell"></i>
          <span class="notification-badge">0</span>
        </div>

        <div class="user-info">
          <span id="companyName">Loading…</span>
          <div class="avatar"><i class="fas fa-truck"></i></div>
        </div>
      </div>
    </div>

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h1>RFQ Inbox</h1>
        <p>Browse and submit quotes on open requests</p>
      </div>

      <button class="btn btn--outline" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

    <!-- COUNT -->
    <div class="rfq-toolbar">
      <span id="rfqCount"></span>
    </div>

    <!-- ✅ FIX: initial loading -->
    <div id="rfqList" class="rfq-list">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </main>
</div>

<!-- MODAL (UNCHANGED — PERFECT) -->
<div id="quoteModal" class="modal" style="display:none">
  <div class="modal-content">

    <div class="modal-header">
      <h3 id="quoteModalTitle">
        <i class="fas fa-comment-dollar"></i> Submit Quote
      </h3>
      <button class="js-close-modal">&times;</button>
    </div>

    <div class="modal-body">
      <form id="quoteForm">

        <div class="form-row">
          <div class="form-group">
            <label>Price per unit *</label>
            <input type="number" id="quotePrice" class="form-control" required />
          </div>

          <div class="form-group">
            <label>Currency</label>
            <select id="currency" class="form-control">
              <option value="USD">USD</option>
              <option value="INR">INR</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Lead Time *</label>
            <input type="number" id="leadTime" class="form-control" required />
          </div>

          <div class="form-group">
            <label>Payment Terms</label>
            <select id="paymentTerms" class="form-control">
              <option value="Net 30">Net 30</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea id="quoteNotes" class="form-control"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--outline js-close-modal">Cancel</button>
          <button type="submit" class="btn btn--primary" id="quoteSubmitBtn">
            Submit Quote
          </button>
        </div>

      </form>
    </div>

  </div>
</div>

<!-- ✅ FIXED JS PATH -->
<script type="module" src="/js/pages/supplier/rfq.js"></script>

</body>
</html>
