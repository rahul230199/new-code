<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Documents | AXO Networks</title>
    <script>
        const token = localStorage.getItem('adminToken') || localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/oem-dashboard.css">
</head>
<body>
    <div class="oem-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><h2>AXO Networks</h2><p>OEM Portal</p></div>
            <nav class="sidebar-nav">
                <a href="/oem-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
                <a href="/oem-rfq.html" class="nav-item"><i class="fas fa-file-alt"></i><span>RFQ Management</span></a>
                <a href="/oem-orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Orders</span></a>
                <a href="/oem-suppliers.html" class="nav-item"><i class="fas fa-truck"></i><span>Suppliers</span></a>
                <a href="/oem-documents.html" class="nav-item"><i class="fas fa-folder-open"></i><span>Documents</span></a>
                <a href="/oem-profile.html" class="nav-item"><i class="fas fa-building"></i><span>Profile</span></a>
            </nav>
            <div class="sidebar-footer"><button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1 id="folderTitle">Loading...</h1>
                    <p id="folderSubtitle">Documents in this folder</p>
                </div>
                <div class="top-bar-right">
                    <div class="notification-bell"><i class="far fa-bell"></i><span class="notification-badge">0</span></div>
                    <div class="user-info"><span id="companyName">Loading...</span><div class="avatar"><i class="fas fa-industry"></i></div></div>
                </div>
            </div>

            <button onclick="window.location.href='/oem-documents.html'" style="margin-bottom: 20px; padding: 8px 20px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;">
                <i class="fas fa-arrow-left"></i> Back to Folders
            </button>

            <div style="background: #f8fafc; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <i class="fas fa-folder-open" style="font-size: 48px; color: #6366f1;"></i>
                    <div>
                        <div style="font-size: 24px; font-weight: 700;" id="folderNameDisplay">-</div>
                        <div style="color: #64748b; margin-top: 4px;" id="fileCount">0 documents</div>
                    </div>
                </div>
            </div>

            <div id="documentsList">
                <div class="loading">Loading documents...</div>
            </div>
        </main>
    </div>

    <div id="docDetailsModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Document Details</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="docDetails"></div>
        </div>
    </div>

    <script src="/js/oem-folder-documents.js"></script>
</body>
</html>
