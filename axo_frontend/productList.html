<script>
(function() {
    const header = document.getElementById('header');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileSidebar = document.getElementById('mobileSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openMobileMenu() {
        mobileSidebar.classList.add('open');
        sidebarOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
        mobileSidebar.classList.remove('open');
        sidebarOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', openMobileMenu);
        // mobileMenuBtn.addEventListener('touchstart', openMobileMenu, { passive: true });
    }

    if (closeSidebar) closeSidebar.addEventListener('click', closeMobileMenu);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeMobileMenu);

    document.querySelectorAll('.mobile-nav-item, .mobile-connect-btn').forEach(item => {
        item.addEventListener('click', closeMobileMenu);
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mobileSidebar.classList.contains('open')) {
            closeMobileMenu();
        }
    });
  // dropdown menu nav
    const mobileDropdownTrigger = document.querySelector('.mobile-dropdown-trigger');
    const mobileDropdownMenu = document.querySelector('.mobile-dropdown-menu');

    if (mobileDropdownTrigger) {
        mobileDropdownTrigger.addEventListener('click', () => {
            mobileDropdownMenu.classList.toggle('open');
            mobileDropdownTrigger.classList.toggle('active');
        });
    }

    const dropdown = document.querySelector('.nav-dropdown');
    const trigger = document.querySelector('.dropdown-trigger');

    if (trigger && dropdown) {

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();

            dropdown.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });
    }
    let lastScrollTop = 0;
    let ticking = false;

    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    header.style.transform = 'translateY(-100%)';
                } else {
                    header.style.transform = 'translateY(0)';
                }

                if (scrollTop > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }

                lastScrollTop = scrollTop;
                ticking = false;
            });
            ticking = true;
        }
    });
})();
</script>
